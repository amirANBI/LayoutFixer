name: build

# One Windows job: build both architectures, run the detector over a sample, keep the zips.
# Pushing a v* tag turns those zips into a GitHub release with the binaries attached.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: build + smoke test (windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      # Each step keeps a transcript in build\, and "explain a failed build" below annotates it:
      # a pwsh failure is otherwise only ever visible as "exit code 1".
      - name: build (self-contained, win-x64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          ./scripts/build.ps1 -Zip *>&1 | Tee-Object -FilePath build/step-x64.log

      - name: build (win-arm64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          ./scripts/build.ps1 -Arch arm64 -Zip *>&1 | Tee-Object -FilePath build/step-arm64.log

      - name: detection smoke test
        shell: pwsh
        run: |
          # --test prints what the app's own detector decides, with no keyboard hook installed, so
          # this proves the word lists and the layout tables really are inside the exe. Both
          # readings checked here are real words, so both have to come back as FIX.
          $exe = Join-Path $PWD "build/publish-win-x64/LayoutFixer.exe"
          $cases = @()
          $cases += @{ Args = '--test "صشدف فخ لقشذ"'; Expect = "صشدف -> want"; Name = "persian" }
          $cases += @{ Args = '--test "sghl"';          Expect = "sghl -> سلام"; Name = "english" }
          foreach ($case in $cases) {
            $log = Join-Path $PWD ("build/step-smoke-" + $case.Name + ".log")
            Start-Process -FilePath $exe -ArgumentList $case.Args -NoNewWindow -Wait `
                          -RedirectStandardOutput $log
            $out = Get-Content -LiteralPath $log -Raw
            Write-Host $out
            if ($out -notmatch [regex]::Escape($case.Expect)) {
              throw "expected '$($case.Expect)' in $($case.Name) test"
            }
            if ($out -cnotmatch "FIX") {
              throw "no suggestion made for a mistyped word in $($case.Name) test"
            }
          }

      - name: the zips are there
        shell: pwsh
        run: |
          Get-ChildItem build/*.zip | ForEach-Object {
            "artifact $($_.Name) $([math]::Round($_.Length / 1MB, 1)) MB"
          }
          foreach ($arch in "x64", "arm64") {
            $found = Get-ChildItem "build/LayoutFixer-*-win-$arch.zip" -ErrorAction SilentlyContinue
            if (-not $found) { throw "no $arch zip was produced" }
          }

      - name: explain a failed build
        if: failure()
        shell: pwsh
        run: |
          # Whatever failed, its own words are in build\*.log. -Include would need a wildcard in
          # -Path to apply at all, so the names are filtered afterwards.
          $logs = Get-ChildItem -Path build -File -Recurse -ErrorAction SilentlyContinue |
                  Where-Object { $_.Name -like "*.log" }
          if (-not $logs) {
            "::error::no build log was written: scripts/build.ps1 never got to compile anything"
          }
          foreach ($log in $logs) {
            $tail = (Get-Content -LiteralPath $log.FullName | Select-Object -Last 40) -join "`n"
            $tail = ($tail -replace "%", "%25") -replace "`r", ""
            $tail = $tail -replace "[^\x20-\x7E`n]", "?"
            "::error::$($log.Name) tail:%0A" + ($tail -replace "`n", "%0A")
          }
          Get-ChildItem -Recurse -Path build -ErrorAction SilentlyContinue | ForEach-Object {
            "::notice::$($_.FullName.Substring($env:GITHUB_WORKSPACE.Length)) $($_.Length) bytes"
          }

      - name: upload the zips
        uses: actions/upload-artifact@v4
        with:
          name: layoutfixer-windows
          path: build/LayoutFixer-*.zip
          if-no-files-found: error
          retention-days: 90

  release:
    name: release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: layoutfixer-windows
          path: dist

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "LayoutFixer $GITHUB_REF_NAME for Windows" \
            --notes "LayoutFixer for Windows: fixes English and Persian keyboard layout mistakes while you type. Unzip, run LayoutFixer.exe, and press Tab when the popup appears. Self-contained, so there is no .NET runtime to install. Not Authenticode-signed yet, so Windows may ask before running it."

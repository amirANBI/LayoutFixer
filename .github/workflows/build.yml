name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: build + smoke test (windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: build (self-contained, win-x64)
        shell: pwsh
        run: ./scripts/build.ps1 -Zip

      - name: build (win-arm64)
        shell: pwsh
        run: ./scripts/build.ps1 -Arch arm64 -Zip

      - name: detection smoke test
        shell: pwsh
        run: |
          # --test prints what the detector decides, without installing a keyboard hook.
          # Both readings here are real words, so both must come back as FIX.
          $log = Join-Path $env:RUNNER_TEMP "test-x64.txt"
          Start-Process -FilePath build\publish-win-x64\LayoutFixer.exe `
                        -ArgumentList '--test "صشدف فخ لقشذ"' -NoNewWindow -Wait `
                        -RedirectStandardOutput $log
          Get-Content $log
          $out = Get-Content $log -Raw
          if ($out -notmatch "صشدف -> want") { throw "wrong reading for the Persian layout" }
          if ($out -notmatch "FIX") { throw "no suggestion made for a mistyped word" }

          $log = Join-Path $env:RUNNER_TEMP "test-english.txt"
          Start-Process -FilePath build\publish-win-x64\LayoutFixer.exe `
                        -ArgumentList '--test "sghl"' -NoNewWindow -Wait `
                        -RedirectStandardOutput $log
          Get-Content $log
          if ((Get-Content $log -Raw) -notmatch "sghl -> سلام") { throw "wrong reading for the English layout" }

      - name: explain a failed build
        if: failure()
        shell: pwsh
        run: |
          # When MSBuild fails with a code the problem matcher does not know, the run looks like an
          # exit code 1 with nothing to read. The build log is the only thing that explains it, so
          # push its tail into an annotation (one annotation, lines joined with %0A).
          $logs = Get-ChildItem -Path build -Filter 'publish-win-*.log' -ErrorAction SilentlyContinue
          if (-not $logs) {
            "::error::no build log was written: scripts/build.ps1 failed before compiling"
          }
          foreach ($log in $logs) {
            $tail = (Get-Content -LiteralPath $log.FullName | Select-Object -Last 45) -join "`n"
            $tail = $tail -replace '%', '%25'
            $tail = $tail -replace "`r", ''
            $tail = $tail -replace "[^\x20-\x7E`n]", '?'
            "::error::" + $log.Name + " (tail):%0A" + ($tail -replace "`n", '%0A')
          }
          Get-ChildItem -Recurse -Path build -ErrorAction SilentlyContinue |
            ForEach-Object { "::notice::$($_.FullName.Substring($env:GITHUB_WORKSPACE.Length)) ($($_.Length) bytes)" }

      - name: upload the zips
        uses: actions/upload-artifact@v4
        with:
          name: layoutfixer-windows
          path: build/LayoutFixer-*.zip
          if-no-files-found: error

  release:
    name: release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: layoutfixer-windows
          path: dist

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "LayoutFixer $GITHUB_REF_NAME for Windows" \
            --generate-notes
